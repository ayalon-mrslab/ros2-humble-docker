# Builds the base image and pushes it to ghcr.io/<repo owner>/ros2-humble-base.
# The owner comes from the repo, so after transferring the repo to the lab organization
# images are published there with no change to this file.
#
# Tags:  push to main      -> latest, sha-<commit>
#        git tag v1.2.3    -> 1.2.3, 1.2, 1
name: Build base image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - ros_entrypoint.sh
      - .github/workflows/build-base.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase (an owner like MRSTechnion is not)
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ros2-humble-base" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
